# .github/workflows/build.yml

name: DH-Blog Build and Release

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  BINARY_NAME: dhblog
  BACKEND_DIR: blog-backend
  FRONTEND_DIR: blog-front

jobs:
  lint:
    name: 🔍 Lint & Dead Code
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v7

      - name: ⚙️ Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: 📦 Install frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: bun install --frozen-lockfile

      - name: ✂️ Knip unused files/exports/dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: bunx knip

      - name: ⚙️ Setup Go
        uses: actions/setup-go@v7
        with:
          # 钉住 patch：'1.27' 会跟着 hostedtoolcache 滑到 1.27.2，而 1.27.2 把 Go 的
          # export data 格式从 v4 提到了 v5，旧版 golangci-lint 读不懂会整段 typecheck 崩掉
          go-version: '1.27.3'
          cache-dependency-path: '${{ env.BACKEND_DIR }}/go.sum'

      # embed 声明了 all:dist，dist 被 gitignore，不占位 golangci-lint 无法加载 internal/frontend
      - name: 📁 Prepare embed dir
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          mkdir -p internal/frontend/dist
          printf '<!doctype html>' > internal/frontend/dist/index.html

      - name: 🔍 golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # 必须 >= v2.14.0：v2.13.x 的 importer 只认 export data v4，读不了 Go 1.27.2 的产物
          version: v2.15.0
          working-directory: ${{ env.BACKEND_DIR }}

      - name: 🧟 Dead code (whole-program reachability)
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          # Go 1.27 给 math/rand/v2.Rand 加了泛型方法 N，x/tools 的 RTA 在 v0.49.x 会因此 panic
          # （golang/go#77549）。修复已进入正式 tag，v0.52.0 起正常，故不再 pin 到 commit；
          # 这里仍然写死版本而不是 @latest，免得哪天上游又引入新的 panic。
          go install golang.org/x/tools/cmd/deadcode@v0.52.0
          $(go env GOPATH)/bin/deadcode -test ./...

  build-and-upload-separately:
    name: 🛠️ Build for ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        include:
          - os: darwin
            arch: arm64
            ext: "-darwin-arm64"
          - os: windows
            arch: amd64
            ext: "-windows-amd64.exe"
          - os: linux
            arch: amd64
            ext: "-linux-amd64"

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v7

      - name: ⚙️ Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: 📦 Build Frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          bun install --frozen-lockfile
          bun run build -- --mode production

      - name: ⚙️ Setup Go
        uses: actions/setup-go@v7
        with:
          # 与 lint job 保持同一个 patch，构建结果才可复现
          go-version: '1.27.3'
          cache-dependency-path: '${{ env.BACKEND_DIR }}/go.sum'

      - name: 🔍 Verify Go dependencies
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          go mod download
          go mod verify

      # 关键步骤：100% 模拟 sh 脚本的文件复制和构建逻辑
      - name: 🏗️ Build Go Binary
        run: |
          EMBED_DIR="${{ env.BACKEND_DIR }}/internal/frontend/dist"

          # 1. 与 build.sh 共用同一个铺包脚本：拷贝 + 预压缩成 .gz（只留压缩版）
          bash blog-deploy/prepare-assets.sh "${{ env.FRONTEND_DIR }}/dist" "$EMBED_DIR"

          # 2. 创建最终的输出目录
          mkdir -p build

          # 3. 构建 Go 二进制文件（nomsgpack: 排除 gin v1.12 无条件引入的 msgpack 绑定及 ugorji codec，省约 5MB，与 blog-deploy/build.sh 保持一致）
          (cd ${{ env.BACKEND_DIR }} && GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -tags nomsgpack -trimpath -ldflags="-s -w" -o ../build/${{ env.BINARY_NAME }}${{ matrix.ext }} ./cmd/blog-backend)
          
          # 4. 验证嵌入成功（可选）
          if [ -f "build/${{ env.BINARY_NAME }}${{ matrix.ext }}" ]; then
            echo "✅ 构建成功: build/${{ env.BINARY_NAME }}${{ matrix.ext }}"
          else
            echo "❌ 构建失败"
            exit 1
          fi

      - name: ⬆️ Upload Binary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BINARY_NAME }}${{ matrix.ext }}
          path: build/${{ env.BINARY_NAME }}${{ matrix.ext }}

  release:
    name: 🚀 Create Release
    runs-on: ubuntu-latest
    needs: build-and-upload-separately
    if: startsWith(github.ref, 'refs/tags/v')
    
    permissions:
      contents: write
    
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v7
        
      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: build
          
      - name: 🏷️ Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/${{ env.BINARY_NAME }}-darwin-arm64/${{ env.BINARY_NAME }}-darwin-arm64
            build/${{ env.BINARY_NAME }}-windows-amd64.exe/${{ env.BINARY_NAME }}-windows-amd64.exe
            build/${{ env.BINARY_NAME }}-linux-amd64/${{ env.BINARY_NAME }}-linux-amd64
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
